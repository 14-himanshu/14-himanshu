<svg width="920" height="400" viewBox="0 0 920 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="space_bg" cx="45%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b0f29"/>
      <stop offset="45%" stop-color="#060919"/>
      <stop offset="75%" stop-color="#030611"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="nebula_purple" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#2e1065" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f29" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula_cyan" cx="20%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#082f49" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030611" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet Gradients & Shading -->
    <radialGradient id="planet_surface" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#4338ca"/>
      <stop offset="95%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0e26"/>
    </radialGradient>
    <linearGradient id="ring_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#e879f9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="hud_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtle_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes shoot {
        0% { transform: translate(0px, 0px); opacity: 0; }
        4% { opacity: 1; }
        20% { transform: translate(-280px, 180px); opacity: 0; }
        100% { transform: translate(-280px, 180px); opacity: 0; }
      }
      @keyframes shoot_alt {
        0% { transform: translate(0px, 0px); opacity: 0; }
        6% { opacity: 0.9; }
        25% { transform: translate(-220px, 140px); opacity: 0; }
        100% { transform: translate(-220px, 140px); opacity: 0; }
      }
      @keyframes float_planet {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(-1deg); }
      }
      @keyframes beacon_blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes cursor_blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .tw-1 { animation: twinkle 3s ease-in-out infinite; }
      .tw-2 { animation: twinkle 4.2s ease-in-out infinite 1.2s; }
      .tw-3 { animation: twinkle 2.5s ease-in-out infinite 0.6s; }
      .tw-4 { animation: twinkle 3.8s ease-in-out infinite 2s; }
      .shooting-star-1 { animation: shoot 7s ease-out infinite 1.5s; }
      .shooting-star-2 { animation: shoot_alt 9s ease-out infinite 4.5s; }
      .floating-body { animation: float_planet 8s ease-in-out infinite; }
      .beacon { animation: beacon_blink 1.8s ease-in-out infinite; }
      .cursor { animation: cursor_blink 1s step-end infinite; }
    </style>
  </defs>

  <!-- Base Viewport Outer Card (Seamless rounded aesthetic for dark & light) -->
  <rect x="1" y="1" width="918" height="398" rx="16" fill="url(#space_bg)"/>
  <rect x="1" y="1" width="918" height="398" rx="16" fill="url(#nebula_purple)"/>
  <rect x="1" y="1" width="918" height="398" rx="16" fill="url(#nebula_cyan)"/>
  <rect x="1" y="1" width="918" height="398" rx="16" stroke="url(#hud_border)" stroke-width="1.5"/>

  <!-- HUD Cockpit Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.85">
    <!-- Top-Left -->
    <path d="M 12 28 L 12 14 Q 12 12 14 12 L 28 12"/>
    <!-- Top-Right -->
    <path d="M 908 28 L 908 14 Q 908 12 906 12 L 892 12"/>
    <!-- Bottom-Left -->
    <path d="M 12 372 L 12 386 Q 12 388 14 388 L 28 388"/>
    <!-- Bottom-Right -->
    <path d="M 908 372 L 908 386 Q 908 388 906 388 L 892 388"/>
  </g>

  <!-- Top Status Telemetry Rail -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace" font-size="10" font-weight="600" letter-spacing="1.5">
    <!-- Status Pill -->
    <circle cx="36" cy="30" r="3.5" fill="#4ade80" class="beacon"/>
    <text x="46" y="33" fill="#86efac">SYS: NOMINAL</text>
    
    <circle cx="160" cy="30" r="3.5" fill="#38bdf8"/>
    <text x="170" y="33" fill="#bae6fd">ORBIT: FULL-STACK / AI</text>

    <circle cx="330" cy="30" r="3.5" fill="#c084fc"/>
    <text x="340" y="33" fill="#e9d5ff">SECTOR: EARTH [IST]</text>

    <text x="760" y="33" fill="#64748b" text-anchor="start">TELEMETRY // HP-014</text>
  </g>

  <line x1="28" y1="44" x2="892" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- Shooting Stars -->
  <g class="shooting-star-1">
    <line x1="720" y1="40" x2="630" y2="100" stroke="url(#cosmic_beam_dark)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="630" cy="100" r="1.5" fill="#ffffff"/>
  </g>
  <g class="shooting-star-2">
    <line x1="450" y1="30" x2="380" y2="75" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="380" cy="75" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Background Starfield (Twinkling Stardust) -->
  <g fill="#ffffff">
    <circle cx="60" cy="90" r="1" class="tw-1" opacity="0.6"/>
    <circle cx="110" cy="130" r="1.5" class="tw-2" opacity="0.8"/>
    <circle cx="95" cy="280" r="1" class="tw-3" opacity="0.5"/>
    <circle cx="210" cy="80" r="1.2" class="tw-4" opacity="0.7"/>
    <circle cx="310" cy="120" r="1" class="tw-1" opacity="0.4"/>
    <circle cx="420" cy="65" r="1.8" class="tw-3" fill="#bae6fd" opacity="0.8"/>
    <circle cx="490" cy="110" r="1" class="tw-2" opacity="0.6"/>
    <circle cx="580" cy="75" r="1.5" class="tw-4" fill="#fbcfe8" opacity="0.7"/>
    <circle cx="640" cy="140" r="1" class="tw-1" opacity="0.5"/>
    <circle cx="850" cy="90" r="1.5" class="tw-3" fill="#bae6fd" opacity="0.9"/>
    <circle cx="880" cy="270" r="1" class="tw-2" opacity="0.6"/>
    <circle cx="780" cy="340" r="1.2" class="tw-4" opacity="0.5"/>
    <circle cx="230" cy="345" r="1.5" class="tw-1" opacity="0.7"/>
    <circle cx="140" cy="360" r="1" class="tw-2" opacity="0.6"/>
  </g>

  <!-- Interactive Constellation Network (Ursa/Cygnus inspired) -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.35">
    <line x1="80" y1="120" x2="130" y2="95"/>
    <line x1="130" y1="95" x2="175" y2="125"/>
    <line x1="175" y1="125" x2="225" y2="105"/>
    <line x1="225" y1="105" x2="255" y2="155"/>
    <line x1="225" y1="105" x2="200" y2="70"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="80" cy="120" r="2" class="tw-1"/>
    <circle cx="130" cy="95" r="2.2" class="tw-2"/>
    <circle cx="175" cy="125" r="2" class="tw-3"/>
    <circle cx="225" cy="105" r="2.5" class="tw-4" filter="url(#subtle_glow)"/>
    <circle cx="255" cy="155" r="2" class="tw-1"/>
    <circle cx="200" cy="70" r="1.8" class="tw-2"/>
  </g>

  <!-- Majestic Ringed Celestial Body (Right Viewport) -->
  <g class="floating-body" transform="translate(735, 195)">
    <!-- Back of Planet Rings -->
    <ellipse cx="0" cy="0" rx="115" ry="34" fill="none" stroke="url(#ring_grad)" stroke-width="12" stroke-linecap="round" transform="rotate(-18)" opacity="0.45" />
    <ellipse cx="0" cy="0" rx="130" ry="38" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="8 6" transform="rotate(-18)" opacity="0.6" />

    <!-- Planetary Orb -->
    <circle cx="0" cy="0" r="68" fill="url(#planet_surface)" />
    
    <!-- Atmospheric Rim Highlight -->
    <circle cx="0" cy="0" r="67" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" filter="url(#subtle_glow)"/>
    <!-- Planet Shadow / Dark Crescent -->
    <path d="M 0 -68 A 68 68 0 0 1 68 0 A 68 68 0 0 1 0 68 A 54 68 0 0 0 0 -68 Z" fill="#030611" opacity="0.65" />

    <!-- Front of Planet Rings (clipped for 3D realism) -->
    <path d="M -110 35 Q 0 75 110 35" fill="none" stroke="url(#ring_grad)" stroke-width="12" stroke-linecap="round" transform="rotate(-18)" />
    <path d="M -125 40 Q 0 85 125 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-18)" opacity="0.8" />

    <!-- Orbiting Satellite Probe -->
    <g transform="translate(-100, -45)">
      <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#subtle_glow)"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="-9" y="-2.5" width="3" height="5" fill="#38bdf8" opacity="0.8"/>
      <rect x="6" y="-2.5" width="3" height="5" fill="#38bdf8" opacity="0.8"/>
      <circle cx="0" cy="-4" r="1" fill="#f43f5e" class="beacon"/>
    </g>

    <!-- Mini Moonlet -->
    <circle cx="120" cy="75" r="4.5" fill="#cbd5e1" filter="url(#subtle_glow)"/>
    <circle cx="120" cy="75" r="4.5" fill="none" stroke="#64748b" stroke-width="0.8"/>
  </g>

  <!-- Central Flight Deck Identity & Typography -->
  <g transform="translate(60, 0)">
    <!-- Sub-heading tag -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="170" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85"/>
      <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="2">CALLSIGN: 14-HIMANSHU</text>
    </g>

    <!-- Main Call-sign Name -->
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Fira Code', monospace" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#neon_glow)">
      HIMANSHU PANDEY
    </text>

    <!-- Role Designation -->
    <text x="2" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="3">
      FULL-STACK SOFTWARE ENGINEER &amp; AI AGENT ARCHITECT
    </text>
    <rect x="495" y="194" width="9" height="17" fill="#38bdf8" class="cursor"/>

    <!-- Mission Statement (High Contrast, Readable on any screen) -->
    <text x="2" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace" font-size="13.5" font-weight="400" fill="#cbd5e1" letter-spacing="1">
      Exploring the infinite frontier of distributed systems, high-concurrency apps &amp; AI intelligence.
    </text>

    <!-- Subsystem Chips / Avionics Tags -->
    <g transform="translate(2, 280)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="124" height="26" rx="6" fill="#07152b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="62" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">REACT · NEXT.JS</text>

      <!-- Chip 2 -->
      <rect x="134" y="0" width="124" height="26" rx="6" fill="#0e0f2b" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <text x="196" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">NODE · EXPRESS</text>

      <!-- Chip 3 -->
      <rect x="268" y="0" width="118" height="26" rx="6" fill="#180c2b" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
      <text x="327" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" fill="#e9d5ff" text-anchor="middle">AI · AGENTS</text>

      <!-- Chip 4 -->
      <rect x="396" y="0" width="110" height="26" rx="6" fill="#071b1e" stroke="#2dd4bf" stroke-width="1" opacity="0.9"/>
      <text x="451" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" fill="#99f6e4" text-anchor="middle">PYTHON · C++</text>
    </g>
  </g>

  <!-- Bottom Laser Accents & Coordinate Bar -->
  <line x1="28" y1="365" x2="892" y2="365" stroke="#1e293b" stroke-width="1"/>
  <rect x="420" y="364" width="80" height="2" fill="#38bdf8" filter="url(#subtle_glow)"/>
  <text x="460" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">TRANSMISSION ACTIVE // SECURE FLIGHT TELEMETRY</text>
</svg>