<svg width="1000" height="36" viewBox="0 0 1000 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cosmic_beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="orbit_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .star-twinkle-1 { animation: pulse 2.5s ease-in-out infinite; transform-origin: center; }
      .star-twinkle-2 { animation: pulse 3.2s ease-in-out infinite 0.8s; transform-origin: center; }
      .star-twinkle-3 { animation: pulse 2.8s ease-in-out infinite 1.5s; transform-origin: center; }
      .star-twinkle-4 { animation: pulse 3.5s ease-in-out infinite 0.4s; transform-origin: center; }
    </style>
  </defs>

  <!-- Horizontal Interstellar Beam -->
  <line x1="80" y1="18" x2="920" y2="18" stroke="url(#cosmic_beam)" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Subtle secondary laser rail -->
  <line x1="220" y1="18" x2="780" y2="18" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="6 14" opacity="0.6" />

  <!-- Constellation Nodes & Twinkling Stardust -->
  <circle cx="160" cy="14" r="1.5" fill="#38bdf8" class="star-twinkle-1" />
  <circle cx="280" cy="22" r="2" fill="#818cf8" class="star-twinkle-2" />
  <polygon points="360,14 362,18 360,22 358,18" fill="#38bdf8" class="star-twinkle-3" />
  <circle cx="430" cy="13" r="1.5" fill="#c084fc" class="star-twinkle-4" />

  <!-- Central Celestial Node / Orbiting Ringed Planetoid -->
  <g transform="translate(500, 18)">
    <ellipse cx="0" cy="0" rx="22" ry="7" fill="none" stroke="url(#orbit_glow)" stroke-width="1.2" transform="rotate(-18)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.5" />
    <circle cx="0" cy="0" r="4.5" fill="#818cf8" />
    <circle cx="0" cy="0" r="2.5" fill="#e0e7ff" />
    <circle cx="0" cy="0" r="1" fill="#ffffff" />
    <circle cx="18" cy="-5" r="1.2" fill="#38bdf8" class="star-twinkle-1" />
  </g>

  <!-- Right Wing Stars -->
  <circle cx="570" cy="23" r="1.5" fill="#c084fc" class="star-twinkle-4" />
  <polygon points="640,14 642,18 640,22 638,18" fill="#38bdf8" class="star-twinkle-2" />
  <circle cx="720" cy="14" r="2" fill="#818cf8" class="star-twinkle-3" />
  <circle cx="840" cy="22" r="1.5" fill="#38bdf8" class="star-twinkle-1" />
</svg>