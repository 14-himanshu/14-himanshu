<svg width="1000" height="36" viewBox="0 0 1000 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cosmic_beam_light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="25%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#4338ca" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1" />
      <stop offset="55%" stop-color="#4338ca" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="orbit_glow_light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="1" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4" />
    </linearGradient>
    <style>
      @keyframes pulse_l {
        0%, 100% { opacity: 0.4; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .star-l1 { animation: pulse_l 2.4s ease-in-out infinite; transform-origin: center; }
      .star-l2 { animation: pulse_l 3.1s ease-in-out infinite 0.7s; transform-origin: center; }
      .star-l3 { animation: pulse_l 2.7s ease-in-out infinite 1.4s; transform-origin: center; }
    </style>
  </defs>

  <line x1="80" y1="18" x2="920" y2="18" stroke="url(#cosmic_beam_light)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="200" y1="18" x2="800" y2="18" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="8 12" opacity="0.8" />

  <!-- Constellation Nodes & Stardust (Sharp contrast on light background) -->
  <circle cx="160" cy="14" r="2" fill="#0284c7" class="star-l1" />
  <circle cx="280" cy="22" r="2.2" fill="#4338ca" class="star-l2" />
  <polygon points="360,13 362.5,18 360,23 357.5,18" fill="#0284c7" class="star-l3" />
  <circle cx="430" cy="13" r="1.8" fill="#7c3aed" class="star-l1" />

  <!-- Center Celestial Core -->
  <g transform="translate(500, 18)">
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="none" stroke="url(#orbit_glow_light)" stroke-width="1.6" transform="rotate(-18)" />
    <circle cx="0" cy="0" r="11" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7" />
    <circle cx="0" cy="0" r="5" fill="#4338ca" />
    <circle cx="0" cy="0" r="3" fill="#818cf8" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    <circle cx="20" cy="-6" r="1.6" fill="#0284c7" class="star-l1" />
  </g>

  <circle cx="570" cy="23" r="1.8" fill="#7c3aed" class="star-l1" />
  <polygon points="640,13 642.5,18 640,23 637.5,18" fill="#0284c7" class="star-l3" />
  <circle cx="720" cy="14" r="2.2" fill="#4338ca" class="star-l2" />
  <circle cx="840" cy="22" r="2" fill="#0284c7" class="star-l1" />
</svg>
